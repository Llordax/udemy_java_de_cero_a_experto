<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarea 1: Formulario de Inicio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .contenedor { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .campo { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-radius; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Ingreso de Parámetros</h2>
        <!-- El formulario envía los datos de forma automática por método GET al Servlet -->
        <form action="resultado.html" method="get">
            <div class="campo">
                <label for="nombre">Nombre (Obligatorio):</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="campo">
                <label for="apellido">Apellido (Obligatorio):</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <button type="submit">Enviar al Servlet</button>
        </form>
    </div>

</body>
</html>
